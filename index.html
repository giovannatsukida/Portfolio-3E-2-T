<!DOCTYPE html> <!--o DocType indica a linguagem de programação que está sendo usado-->
<html lang="pt-br"> <!--início do código-->
<head> <!--início do cabeçalho do documento. Dentro dessa tag pode ser inseridas folhas de estilo e scripts-->
    <meta charset="UTF-8"> <!--indica qual será os caractéres (character set ou charset) será utilizado para renderizar o texto da página.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio</title> <!--fechamento do projeto-->
    <link rel="stylesheet" href="style.css"
</head> <!--fim do cabeçalho do documento-->
<body> <!--nesse espaço está contido o conteúdo visual da página. As tags que representam texto, botões e outros devem ser adicionadas nesse intervalo.-->
    <!--Um documento HTML é composto por tags que são escritas entre < >. As tags precisam ser abertas e fechadas, o que diferenciam é que as tags de fechamento possuem uma \ antes do nome. Alguns códigos não precisam da <\> para fechamento, apenas da barra, como o caso da tag meta. Outro aspecto importante da linguagem é que ela é case insensitive, ou seja, não leva em consideração a diferença entre letras oficiais e minúsculas-->
    <!--No HTML, há seis níveis de cabeçalhos/títulos que podem ser usados por meios das tags h1, h2, h3, h4, h5 e h6, sendo o h1 o maior e mais relevante e o h6 o menor/menos relevante.-->
    <h1>Portfólio</h1>
    <h2>Programação</h2>
    <h3>HTML</h3>
    <h4>CSS</h4>
    <h5>JS</h5>
    <h6>Matemática</h6>
    <!--Parágrafos de texto são gerados em HTML por meio das tags <p> <\p>. Esse é um exemplo de tag cuja disposição na tela se dá em forma de bloco, ou seja, um parágrafo é colocado sempre abaixo do outro-->
        <p> Serve para colocar Parágrafos no projeto, são os textos que aparecerão no site.</p>
        <p> Segundo parágrafo.</p>


        <p align="center">
            <img src="img/images.jpeg" alt="baphomet" width="250">
        </p>
</body> <!--fechamento da tag-->
</html> <!--fim do código-->
